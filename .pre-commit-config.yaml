fail_fast: true
# The synthetic benchmark's corpus, mutations and patches are byte-exact and digested, the agents under
# agents/synthetic/ are kept exactly as they ran (the optimizer wrote their code), the contract-test fixture's line
# numbers are part of the test, and the demo's recording is replayed byte by byte: no hook may rewrite them.
exclude: ^(data/synthetic-components/(corpus|mutations|patches)|agents/synthetic|src/security_agent/synthetic/fixture|demo/recording)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast # checks Python syntax
      - id: check-json # checks JSON syntax
      - id: check-merge-conflict # checks for no merge conflict strings
      - id: check-shebang-scripts-are-executable # checks all shell scripts have executable permissions
      - id: check-toml # checks TOML syntax
      - id: check-yaml # checks YAML syntax
      - id: end-of-file-fixer # checks there is a newline at the end of the file
      - id: mixed-line-ending # normalizes line endings
      - id: no-commit-to-branch # prevents committing to main
      - id: trailing-whitespace # trims trailing whitespace
        args: [--markdown-linebreak-ext=md, --markdown-linebreak-ext=mdx]
        exclude: \.patch$ # a unified diff's blank context lines are a single space

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
      types_or: [python, pyi, jupyter, mdx]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--toml", "pyproject.toml"]
        exclude: cwe_reference\.json$ # MITRE's text, kept as published
        additional_dependencies:
          - tomli

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint-docker
        args: ["-ignore", "SC2102"]
