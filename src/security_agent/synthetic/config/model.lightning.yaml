# Nemotron 3.5 Lightning (30B total, 3B active per token) through the stock NVIDIA NIM, as set up by
# serving/nemotron-3.5-lightning (loopback only). Start it from the repository root with
# `hatch run serving:lightning start` (about 4 minutes until ready), and pass `--model-config model.lightning.yaml`.
# The reported synthetic numbers use model.yaml.

api_base_url: http://127.0.0.1:8000/v1
model: nemotron-3.5-lightning
timeout_s: 600
max_retries: 3

# = the server's --max-num-seqs; one global limit shared by all steps and repositories.
concurrency: 8

temperature: 0.0

