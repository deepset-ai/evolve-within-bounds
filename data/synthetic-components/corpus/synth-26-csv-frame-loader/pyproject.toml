# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csv-frame-loader-haystack"
version = "0.1.0"
description = "Loads delimited content into frames for tabular retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["haystack", "component"]
authors = [{ name = "Example Maintainer", email = "maintainer@example.invalid" }]
dependencies = ["haystack-ai"]

[project.urls]
Source = "https://github.com/example-org/csv-frame-loader-haystack"

[tool.hatch.build.targets.wheel]
packages = ["src/custom_components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
