# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "component-rehydrator-haystack"
version = "0.1.0"
description = "Reconstructs components from serialized pipeline state"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["haystack", "component"]
authors = [{ name = "Example Maintainer", email = "maintainer@example.invalid" }]
dependencies = ["haystack-ai"]

[project.urls]
Source = "https://github.com/example-org/component-rehydrator-haystack"

[tool.hatch.build.targets.wheel]
packages = ["src/haystack_integrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
