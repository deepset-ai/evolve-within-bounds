[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "haystack-component-vulnerability-benchmark"
version = "0.2.0"
description = "A paired, whole-repository benchmark for agents that find security vulnerabilities in Haystack custom components"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["haystack", "security", "benchmark", "static-analysis", "vulnerability"]
authors = [{ name = "deepset.ai" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
hvbench = "haystack_component_vulnerability_benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/haystack_component_vulnerability_benchmark"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "haystack_component_vulnerability_benchmark/assets/data"
"corpus" = "haystack_component_vulnerability_benchmark/assets/corpus"
"patches" = "haystack_component_vulnerability_benchmark/assets/patches"
"mutations" = "haystack_component_vulnerability_benchmark/assets/mutations"
"schemas" = "haystack_component_vulnerability_benchmark/assets/schemas"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The corpus and the mutation files are byte-exact and digested: never lint or reformat them.
extend-exclude = ["corpus", "mutations"]
