# The looped candidate, written by the optimizer from the starting candidate (../seed) and picked afterwards as the
# candidate with the most validation pairs right. Around the agent it adds two pipeline steps: hunter (greps for
# dangerous patterns and leaves notes for the agent) and verifier (asks the model whether each finding is safe code
# with a control in place, and retracts it if so). It gives the agent a search tool and a long prompt that names
# vulnerability classes and their safe counterparts, and raises the agent's limits. No connection runs hunter before
# the agent, so the agent's first message is rendered without its notes: it is the same as without hunter, in every
# scan we measured. The optimizer wrote everything below and in prompts/ and tools/, as it ran; only this comment and
# the component types' module paths are ours.
components:
  hunter:
    type: security_agent.synthetic.agent.CodeStep
    init_parameters:
      code: tools/hunter.py
      max_calls: 40
      max_completion_tokens: 60000
      timeout_s: 1200
  agent:
    type: security_agent.synthetic.agent.ScanAgent
    init_parameters:
      system_prompt: prompts/system.md
      user_prompt: prompts/user.jinja2
      tools:
      - read_file
      - run_python
      - tools/search.py
      max_agent_steps: 30
      max_tokens: 8192
      thinking_budget: 4096
      temperature: 0.0
      read_file_lines: 250
      file_list_chars: 12000
      tool_output_chars: 12000
      tool_timeout_s: 90
      tool_model_calls: 200
      tool_completion_tokens: 120000
      scan_prompt_tokens: 3000000
      scan_completion_tokens: 120000
      timeout_s: 2400
  verifier:
    type: security_agent.synthetic.agent.CodeStep
    init_parameters:
      code: tools/verifier.py
      max_calls: 40
      max_completion_tokens: 60000
      timeout_s: 1200
  normalizer:
    type: security_agent.synthetic.normalize.Normalizer
    init_parameters:
      max_per_location: 1
      tau: 0
connections:
- sender: agent.findings
  receiver: verifier.findings
- sender: verifier.findings
  receiver: normalizer.candidates
