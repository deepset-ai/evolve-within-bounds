#
# The sandbox's policy, added to NemoClaw's base policy at onboarding. Deny by default: the only network destination is
# the managed inference route to the model server on the host. The installed package is read-only; jobs and results
# live under /sandbox/security-agent, scratch copies under /tmp.

version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /opt/venv
    - /opt/security-agent
    - /opt/nemoclaw-security-triage
    - /opt/nemoclaw-security-triage-config
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: strict

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  managed_inference:
    name: managed_inference
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/chat/completions" }
          - allow: { method: GET, path: "/v1/models" }
          - allow: { method: GET, path: "/v1/models/**" }
    binaries:
      # OpenShell attributes traffic to the binary the kernel resolves: /opt/venv/bin/python3 is a symlink to the
      # base image's /usr/local/bin/python3.12, so both are listed.
      - { path: /usr/local/bin/security-agent }
      - { path: /opt/venv/bin/python3* }
      - { path: /usr/local/bin/python3* }
